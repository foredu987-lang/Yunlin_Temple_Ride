<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>雲林祈福鐵馬道 (智慧導覽版)</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* 基礎設定 */
        body { margin: 0; padding: 0; font-family: 'Noto Serif TC', '微軟正黑體', sans-serif; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* Story Card 底部彈出面板設計 */
        .story-card-container {
            position: fixed;
            bottom: -100%; /* 預設隱藏在畫面下方 */
            left: 0;
            width: 100%;
            max-height: 85vh; /* 最高佔畫面 85% */
            background: #ffffff;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 9999;
            display: flex;
            flex-direction: column;
        }

        .story-card-container.active {
            bottom: 0;
        }

        .story-card-header {
            text-align: center;
            padding: 12px;
            background: #fff;
            border-radius: 20px 20px 0 0;
            position: relative;
        }

        .drag-handle {
            width: 40px;
            height: 5px;
            background: #ddd;
            border-radius: 3px;
            margin: 0 auto;
        }

        .close-btn {
            position: absolute;
            right: 15px;
            top: 5px;
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: #888;
        }

        .story-card-scroll-area {
            overflow-y: auto;
            padding-bottom: 30px;
        }

        .story-card-image-wrapper {
            width: 100%;
            height: 220px;       /* 把高度限制放在外層容器 */
            overflow: hidden;    /* 隱藏超出的部分 */
            background-color: #f5f5f5;
        }

        .story-card-image-wrapper img {
            width: 100%;
            height: 100%;        /* 讓圖片填滿容器的高度 */
            object-fit: cover;   /* 保持比例，自動裁切填滿 */
            display: block;      /* 消除圖片底部的預設空白間隙 */
        }

        .story-card-body {
            padding: 20px;
        }

        .card-title {
            margin: 0 0 5px 0;
            color: #222;
            font-size: 24px;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .card-subtitle {
            margin: 0 0 15px 0;
            color: #6ABA01; /* 雲林慢遊綠 */
            font-weight: bold;
            font-size: 16px;
        }

        /* 頁籤設計 */
        .card-tabs {
            display: flex;
            border-bottom: 2px solid #eee;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            background: none;
            border: none;
            padding: 10px;
            font-size: 16px;
            cursor: pointer;
            color: #888;
            font-weight: bold;
            transition: color 0.2s;
        }

        .tab-btn.active {
            color: #6ABA01;
            border-bottom: 3px solid #6ABA01;
        }

        .tab-content {
            display: none;
            line-height: 1.8;
            color: #444;
            font-size: 15px;
            text-align: justify;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in-out;
        }

        .info-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .info-list li {
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 地圖容器 -->
    <div id="map"></div>

    <!-- Story Card 底部彈出面板 -->
    <div id="storyCard" class="story-card-container">
        <div class="story-card-header">
            <div class="drag-handle"></div>
            <button id="closeCardBtn" class="close-btn">×</button>
        </div>
        
        <div class="story-card-scroll-area">
            <!-- 頂部圖片區 -->
            <div class="story-card-image-wrapper">
                <img id="cardImage" src="" alt="景點圖片">
                <div id="cardImageSource" style="text-align: right; font-size: 11px; color: #888; padding: 2px 10px;"></div>
            </div>
            
            <div class="story-card-body">
                <h2 id="cardTitle" class="card-title">載入中...</h2>
                <p id="cardSubtitle" class="card-subtitle">...</p>
                
                <!-- 資訊頁籤按鈕 -->
                <div class="card-tabs">
                    <button class="tab-btn active" onclick="switchTab('story', event)">在地故事</button>
                    <button class="tab-btn" onclick="switchTab('info', event)">導覽資訊</button>
                </div>
                
                <!-- 頁籤內容區 -->
                <div id="tab-story" class="tab-content active">
                    <p id="cardStory">故事讀取中，請稍候...</p>
                </div>

                <div id="tab-info" class="tab-content">
                    <ul class="info-list">
                        <li>📍 <span id="cardAddress">地址讀取中...</span></li>
                        <li>🚴 建議騎乘：MOOVO 電輔車</li>
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. 定義地標資料 (精簡版：高鐵站 + 6 大指標廟宇)
        const POIs = {
            "hsr": { id: "hsr", name: "雲林高鐵站", type: "station", coords: [120.3937, 23.7360], desc: "MOOVO 租借與起點" },
            "t_chaotian": { id: "t_chaotian", name: "北港朝天宮", type: "temple", coords: [120.3019, 23.5681], desc: "天上聖母 (北港媽)" },
            "t_wude": { id: "t_wude", name: "北港武德宮", type: "temple", coords: [120.3033, 23.5831], desc: "天官武財神" },
            "t_fuxing": { id: "t_fuxing", name: "西螺福興宮", type: "temple", coords: [120.4632, 23.8016], desc: "天上聖母 (太平媽)" },
            "t_nansheng": { id: "t_nansheng", name: "斗六南聖宮", type: "temple", coords: [120.5564, 23.6933], desc: "關聖帝君 (恩主公)" },
            "t_chifa": { id: "t_chifa", name: "虎尾持法媽祖宮", type: "temple", coords: [120.4617, 23.7389], desc: "天上聖母 (全台最美文風媽祖廟)" },
            "t_liufang": { id: "t_liufang", name: "六房媽紅壇", type: "temple", coords: [120.4431, 23.7121], desc: "六房天上聖母 (無固定廟宇)" }
        };

        // 2. 初始化地圖 (預設視角：雲林中心，稍微縮小讓6間廟都能看見)
        const map = L.map('map').setView([23.7000, 120.4200], 11);

        // 載入 OpenStreetMap 底圖
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors',
            maxZoom: 18
        }).addTo(map);

        // 3. 在地圖上放置這 7 個點的標記
        for (const key in POIs) {
            const poi = POIs[key];
            // 座標在 Leaflet 中是 [緯度, 經度]，所以要把我們的 [經度, 緯度] 反轉
            const marker = L.marker([poi.coords[1], poi.coords[0]]).addTo(map);
            
            // 如果是廟宇，綁定點擊事件顯示 Story Card
            if (poi.type === 'temple') {
                marker.bindTooltip(poi.name, {permanent: true, direction: "top", offset: [0, -10], className: 'map-label'});
                marker.on('click', () => showStoryCard(key));
            } else {
                // 高鐵站直接顯示文字即可
                marker.bindPopup(`<b>${poi.name}</b><br>${poi.desc}`);
            }
        }

        // --- Story Card 互動邏輯 ---

        // 關閉卡片
        document.getElementById('closeCardBtn').addEventListener('click', () => {
            document.getElementById('storyCard').classList.remove('active');
        });

        // 頁籤切換
        function switchTab(tabId, event) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById('tab-' + tabId).classList.add('active');
        }

        // 動態讀取 JSON 並顯示卡片
        async function showStoryCard(poiId) {
            const poi = POIs[poiId];
            if(!poi) return;
            
            // 每次打開先切換回「在地故事」頁籤
            document.querySelectorAll('.tab-btn')[0].click();

            // 狀態初始化
            document.getElementById('cardTitle').innerText = poi.name;
            document.getElementById('cardSubtitle').innerText = poi.desc;
            document.getElementById('cardAddress').innerText = "資料讀取中...";
            document.getElementById('cardStory').innerText = "在地故事載入中...";
            document.getElementById('cardImage').src = ""; // 觸發佔位圖
            
            // 彈出卡片
            document.getElementById('storyCard').classList.add('active');

            try {
                // 向 GitHub /story/ 資料夾請求資料
                const response = await fetch(`./story/${poiId}.json`);
                if (!response.ok) throw new Error("無對應的 JSON 檔案"); 
                
                const data = await response.json();

                if(data.government && data.government.address) {
                    document.getElementById('cardAddress').innerText = data.government.address;
                }
                if(data.story && data.story.localStory) {
                    document.getElementById('cardStory').innerText = data.story.localStory;
                }
                
                // --- 圖片待處理機制 ---
                const imgUrl = data.government?.image;
                const cardImageEl = document.getElementById('cardImage');

                // 如果網址不存在、是空字串，或者是「待處理」
                if (!imgUrl || imgUrl.trim() === "" || imgUrl.includes("待處理")) {
                    // 使用內建的 SVG 向量圖產生灰底與文字，完全不依賴外部網路
                    const pendingSvg = `data:image/svg+xml;charset=UTF-8,<svg xmlns="http://www.w3.org/2000/svg" width="400" height="220" viewBox="0 0 400 220"><rect width="400" height="220" fill="%23eeeeee"/><text x="50%" y="50%" font-family="sans-serif" font-size="20" fill="%23888888" text-anchor="middle" dominant-baseline="middle">圖片待處理</text></svg>`;
                    cardImageEl.src = pendingSvg;
                } else {
                    // 如果有正常的網址，就載入該圖片
                    cardImageEl.src = imgUrl;
                }
                
                // --- 圖片版權來源 ---
                if (data.government && data.government.imageSource) {
                    document.getElementById('cardImageSource').innerText = data.government.imageSource;
                } else {
                    document.getElementById('cardImageSource').innerText = "";
                }
                
            } catch (error) {
                console.warn(`${poiId}.json 尚未建置，啟用防呆顯示。`);
                document.getElementById('cardAddress').innerText = "雲林縣 (詳細地址建置中)";
                document.getElementById('cardStory').innerText = "這是雲林在地的重要信仰中心。此處的詳細導覽文史資料正在建置中，敬請期待未來的更新！";
            }
        }
    </script>
</body>
</html>
